name: "构建 noFingerprintBrowser（反指纹浏览器）"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */3 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "拉取代码"
        uses: actions/checkout@v4

      - name: "安装 JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: "安装 Gradle 9.0"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.0.0"

      - name: "查看可用的 android-3x 平台"
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list 2>&1 \
            | grep -E "platforms;android-3[0-9]|platforms;android-.*preview" | sort -u | head -30
          echo "------ canary 通道 ------"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --channel=3 --list 2>&1 \
            | grep -E "platforms;android-3[0-9]|platforms;android-.*preview" | sort -u | head -30

      - name: "安装 Android SDK 平台和构建工具"
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --channel=3 "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1 \
            || yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
              "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: "查询 GeckoView Nightly 最新版本号"
        id: gv
        run: |
          VER=$(curl -sf "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-nightly-omni-arm64-v8a/maven-metadata.xml" \
            | grep -oP '(?<=<latest>)[^<]+' | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "本次使用的 GeckoView 版本：$VER"

      - name: "把版本号注入到 build.gradle"
        run: |
          sed -i "s/__GV_VERSION__/${{ steps.gv.outputs.version }}/" app/build.gradle

      - name: "编译 Debug APK"
        run: gradle assembleDebug --no-daemon

      - name: "给 APK 重命名加上日期时间"
        run: |
          TS=$(date -u +%Y%m%d-%H%M)
          cp app/build/outputs/apk/debug/app-debug.apk "noFP-${TS}.apk"
          echo "APK_NAME=noFP-${TS}.apk" >> $GITHUB_ENV

      - name: "上传到 Release（同日重复上传会覆盖）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          gh release create "$TAG" "${{ env.APK_NAME }}" \
            --title "Nightly $TAG" --notes "自动构建" || \
          gh release upload "$TAG" "${{ env.APK_NAME }}" --clobber
