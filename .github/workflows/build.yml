name: "构建 noFingerprintBrowser（反指纹浏览器）"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */3 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "拉取代码"
        uses: actions/checkout@v4

      - name: "安装 JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "安装 Gradle 8.11.1"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: "缓存 Android SDK 目录"
        uses: actions/cache@v4
        with:
          path: ~/.android-sdk-extra
          key: android-sdk-36-${{ runner.os }}

      - name: "安装 Android SDK（android-36 + build-tools 36）"
        run: |
          SDK_DIR="$HOME/.android-sdk-extra"
          mkdir -p "$SDK_DIR"
          if [ ! -d "$SDK_DIR/platforms/android-36" ]; then
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
              --sdk_root="$SDK_DIR" \
              "platforms;android-36" "build-tools;36.0.0" > /dev/null
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

      - name: "选取 GeckoView 版本（取倒数第 5 个，约 5 天前）"
        id: gv
        run: |
          VER=$(curl -sf "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-nightly-omni-arm64-v8a/maven-metadata.xml" \
            | grep -oP '(?<=<version>)[^<]+' | tail -5 | head -1)
          if [ -z "$VER" ]; then
            VER=$(curl -sf "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-nightly-omni-arm64-v8a/maven-metadata.xml" \
              | grep -oP '(?<=<latest>)[^<]+' | head -1)
          fi
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "本次使用的 GeckoView 版本：$VER"

      - name: "把版本号注入到 build.gradle"
        run: |
          sed -i "s/__GV_VERSION__/${{ steps.gv.outputs.version }}/" app/build.gradle

      - name: "编译 Debug APK"
        run: gradle assembleDebug --no-daemon

      - name: "给 APK 重命名加上日期时间"
        run: |
          TS=$(date -u +%Y%m%d-%H%M)
          cp app/build/outputs/apk/debug/app-debug.apk "noFP-${TS}.apk"
          echo "APK_NAME=noFP-${TS}.apk" >> $GITHUB_ENV

      - name: "上传到 Release（同日重复上传会覆盖）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          gh release create "$TAG" "${{ env.APK_NAME }}" \
            --title "Nightly $TAG" --notes "自动构建" || \
          gh release upload "$TAG" "${{ env.APK_NAME }}" --clobber
