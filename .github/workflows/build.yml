name: "Build NoFingerprintBrowser"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 */3 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: "Setup JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: "Setup minimal Android SDK"
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: "Resolve latest GeckoView Nightly"
        id: gv
        run: |
          VER=$(curl -sf "https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-nightly-omni-arm64-v8a/maven-metadata.xml" \
            | grep -oP '(?<=<latest>)[^<]+' | head -1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "GeckoView: $VER"

      - name: "Inject version"
        run: |
          sed -i "s/__GV_VERSION__/${{ steps.gv.outputs.version }}/" app/build.gradle

      - name: "Build Debug APK"
        run: gradle assembleDebug --no-daemon

      - name: "Rename APK"
        run: |
          TS=$(date -u +%Y%m%d-%H%M)
          cp app/build/outputs/apk/debug/app-debug.apk "noFP-${TS}.apk"
          echo "APK_NAME=noFP-${TS}.apk" >> $GITHUB_ENV

      - name: "Upload Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)"
          gh release create "$TAG" "${{ env.APK_NAME }}" \
            --title "Nightly $TAG" --notes "Auto build" || \
          gh release upload "$TAG" "${{ env.APK_NAME }}" --clobber
