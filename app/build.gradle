plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nofp.browser'
    compileSdk 36

    defaultConfig {
        applicationId "com.nofp.browser"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview-nightly-omni-arm64-v8a:__GV_VERSION__'
}
